# Bare domain redirects to www, matching the canonical URLs in the pages.
server {
    listen 80;
    server_name joinnode.ai;
    return 301 https://www.joinnode.ai$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve /brands and /nodes as well as /brands.html and /nodes.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Content-addressed assets are safe to cache hard; HTML is not.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
